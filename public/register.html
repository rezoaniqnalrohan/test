<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Product Manager</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon auth-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <h1>Create Account</h1>
        <p>Sign up to start tracking and organizing your products</p>
      </div>

      <!-- General Alert Message -->
      <div id="authAlert" class="alert alert-danger hidden" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input 
            type="text" 
            id="registerName" 
            placeholder="John Doe" 
            required 
            autocomplete="name"
            autofocus
          >
          <div class="field-error" id="registerNameError"></div>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email Address</label>
          <input 
            type="email" 
            id="registerEmail" 
            placeholder="you@example.com" 
            required 
            autocomplete="email"
          >
          <div class="field-error" id="registerEmailError"></div>
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input 
            type="password" 
            id="registerPassword" 
            placeholder="At least 6 characters" 
            required 
            autocomplete="new-password"
            minlength="6"
          >
          <div class="field-error" id="registerPasswordError"></div>
        </div>

        <button type="submit" id="btnRegisterSubmit" class="btn btn-primary btn-block">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/login.html">Log in</a></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
